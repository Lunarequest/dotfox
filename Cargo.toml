[package]
name = "dotfox"
version = "0.5.1"
edition = "2021"
homepage = "https://github.com/Lunarequest/dotfox/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
dirs = "5.0.1"
git2 = "0.19.0"
gpgme = { version = "0.11.0", features = ["v1_18"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.132"
owo-colors = { version = "4.1.0", features = [
  "alloc",
  "supports-color",
  "supports-colors",
] }
tabled = "0.17.0"
platform-info = "2.0.4"
anyhow = "1.0.86"
git2_credentials = "0.14.0"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
